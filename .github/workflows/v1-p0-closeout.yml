name: V1 P0 Closeout

on:
  push:
    branches:
      - v1-dev
    paths:
      - '.github/workflows/v1-p0-closeout.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1-dev
        uses: actions/checkout@v4
        with:
          ref: v1-dev
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Pull latest v1-dev
        run: git pull --ff-only origin v1-dev

      - name: Apply exact P0 closeout patch
        run: python3 scripts/v1_p0_closeout_patch.py

      - name: Node MCP syntax check
        run: node --check mcp/server.js

      - name: Cloudflare Worker syntax check
        run: node --check server/cloudflare-worker/worker.js

      - name: Python Server syntax check
        run: python3 -m py_compile server/linjian_server.py

      - name: Pure Java AppGate behavior tests
        run: |
          rm -rf /tmp/appgate-tests
          mkdir -p /tmp/appgate-tests
          javac -d /tmp/appgate-tests \
            android/app/src/main/java/dev/linjian/peek/AppGateDecisionRules.java \
            android/tests/AppGateDecisionRulesTest.java \
            android/tests/AppGateStateTransitionTest.java
          java -cp /tmp/appgate-tests dev.linjian.peek.AppGateDecisionRulesTest
          java -cp /tmp/appgate-tests dev.linjian.peek.AppGateStateTransitionTest

      - name: Build Android debug APK
        run: bash android/build.sh

      - name: Verify APK exists
        run: ls -lh android/*.apk

      - name: Git diff check
        run: git diff --check

      - name: Show focused diff
        run: |
          git diff -- \
            android/app/src/main/java/dev/linjian/peek/AppGate.java \
            android/app/src/main/java/dev/linjian/peek/AppGateDecisionRules.java \
            android/tests/AppGateStateTransitionTest.java \
            mcp/server.js \
            server/cloudflare-worker/worker.js

      - name: Commit and push P0 closeout to v1-dev only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            android/app/src/main/java/dev/linjian/peek/AppGate.java \
            android/app/src/main/java/dev/linjian/peek/AppGateDecisionRules.java \
            android/tests/AppGateStateTransitionTest.java \
            mcp/server.js \
            server/cloudflare-worker/worker.js
          if git diff --cached --quiet; then
            echo "No P0 closeout source changes to commit."
            exit 1
          fi
          git commit -m "fix(appgate): close Phase 1 P0 consistency gaps"
          git pull --rebase origin v1-dev
          git push origin HEAD:v1-dev
