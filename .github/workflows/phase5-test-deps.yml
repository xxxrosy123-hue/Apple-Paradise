name: Phase 5 Test Dependencies
on:
  push:
    branches: [v1-dev]
    paths: ['.github/workflows/phase5-test-deps.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch JVM JSON dependency
        run: |
          mkdir -p /tmp/phase5-deps
          curl -fL --retry 3 -o /tmp/phase5-deps/json.jar https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
      - uses: actions/upload-artifact@v4
        with:
          name: phase5-test-deps
          path: /tmp/phase5-deps/json.jar
          retention-days: 1
