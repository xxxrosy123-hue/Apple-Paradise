name: V1 Phase 2 Todo Closeout

on:
  push:
    branches: [v1-dev]
    paths:
      - 'scripts/v1_phase2_todo_closeout_patch.py'
      - '.github/workflows/v1-phase2-todo-closeout.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1-dev
        uses: actions/checkout@v4
        with:
          ref: v1-dev
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Pull latest v1-dev
        run: git pull --ff-only origin v1-dev

      - name: Apply exact Phase 2 closeout patch
        run: python3 scripts/v1_phase2_todo_closeout_patch.py

      - name: Node MCP syntax check
        run: node --check mcp/server.js

      - name: Cloudflare Worker syntax check
        run: node --check server/cloudflare-worker/worker.js

      - name: Python Server syntax check
        run: python3 -m py_compile server/linjian_server.py

      - name: Cloudflare Todo enum schema contract check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('server/cloudflare-worker/worker.js').read_text(encoding='utf-8')
          required = [
            'filter: { type: "string", enum: ["all", "open", "completed", "overdue", "due_today"], default: "all" }',
            'status: { type: "string", enum: ["open", "completed"] }',
            'operation: { type: "string", enum: ["create", "update", "complete", "reopen", "delete"] }',
          ]
          for item in required:
            if s.count(item) != 1:
              raise SystemExit(f'Worker Todo enum contract missing/duplicated: {item}')
          print('Cloudflare Todo enum schema contract: PASS')
          PY

      - name: Todo pure-Java behavior tests
        run: |
          curl -fsSL -o /tmp/json.jar https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          rm -rf /tmp/todo-test && mkdir -p /tmp/todo-test
          javac -cp /tmp/json.jar -d /tmp/todo-test \
            android/app/src/main/java/dev/linjian/peek/TodoStateCore.java \
            android/tests/TodoStateBehaviorTest.java
          java -cp /tmp/todo-test:/tmp/json.jar dev.linjian.peek.TodoStateBehaviorTest

      - name: Existing AppGate regression tests
        run: |
          rm -rf /tmp/appgate-test && mkdir -p /tmp/appgate-test
          javac -d /tmp/appgate-test \
            android/app/src/main/java/dev/linjian/peek/AppGateDecisionRules.java \
            android/tests/AppGateDecisionRulesTest.java \
            android/tests/AppGateStateTransitionTest.java
          java -cp /tmp/appgate-test dev.linjian.peek.AppGateDecisionRulesTest
          java -cp /tmp/appgate-test dev.linjian.peek.AppGateStateTransitionTest

      - name: Build Android debug APK
        run: bash android/build.sh

      - name: Verify APK exists
        run: test -f android/Zhangxinchuang-public-v0.3.8.4.apk && ls -lh android/Zhangxinchuang-public-v0.3.8.4.apk

      - name: Git diff check
        run: git diff --check

      - name: Show focused diff
        run: git status --short && git diff --stat

      - name: Commit Phase 2 closeout to v1-dev only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            android/app/src/main/java/dev/linjian/peek/TodoStateCore.java \
            android/tests/TodoStateBehaviorTest.java \
            server/cloudflare-worker/worker.js
          git commit -m "fix(todo): close Phase 2 MCP query contract gap"
          git push origin HEAD:v1-dev
