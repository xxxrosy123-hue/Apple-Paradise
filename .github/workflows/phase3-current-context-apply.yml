name: Apply and verify Phase 3 current context

on:
  push:
    branches: [v1-dev]
    paths:
      - .github/workflows/phase3-current-context-apply.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout v1-dev
        uses: actions/checkout@v4
        with:
          ref: v1-dev
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply exact Phase 3 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          COMPOSER = r'''export const CURRENT_CONTEXT_SCHEMA_VERSION = 1;
          export const CURRENT_CONTEXT_STALE_AFTER_MS = 30000;
          export const CURRENT_CONTEXT_TODO_LIST_LIMIT = 8;

          function isObject(value) {
            return value && typeof value === "object" && !Array.isArray(value);
          }

          function numberOrNull(value) {
            const n = Number(value);
            return Number.isFinite(n) ? n : null;
          }

          function positiveNumberOrNull(value) {
            const n = numberOrNull(value);
            return n !== null && n > 0 ? n : null;
          }

          function put(out, key, value) {
            if (value === undefined || value === null || value === "") return;
            out[key] = value;
          }

          function copyKnown(source, keys) {
            const out = {};
            for (const key of keys) {
              if (source && Object.prototype.hasOwnProperty.call(source, key)) put(out, key, source[key]);
            }
            return out;
          }

          function freshnessEntry(updatedAtMs, nowMs, source, transport, staleAfterMs) {
            const timestamp = positiveNumberOrNull(updatedAtMs);
            const ageMs = timestamp === null ? null : Math.max(0, nowMs - timestamp);
            return {
              source,
              transport,
              updated_at_ms: timestamp,
              age_ms: ageMs,
              stale_after_ms: staleAfterMs,
              stale: ageMs === null || ageMs >= staleAfterMs
            };
          }

          function normalizeDecision(decision) {
            return String(decision || "").trim().toUpperCase();
          }

          function sanitizeControl(raw) {
            if (!isObject(raw)) return null;
            const decision = normalizeDecision(raw.decision);
            const pkg = String(raw.package || "").trim();
            if (!pkg || (decision !== "ALLOW" && decision !== "LOCK")) return null;
            const out = copyKnown(raw, [
              "decision", "package", "app_name", "decision_id", "reason", "source", "approved_by",
              "type", "purpose", "mode", "created_at_ms", "created_at_local", "start_at_ms",
              "expires_at_ms", "expires_at_local", "remaining_ms", "allowed_ms", "used_ms", "active"
            ]);
            out.decision = decision;
            out.package = pkg;
            return out;
          }

          function authoritativeControls(appGate) {
            if (!isObject(appGate)) return [];
            const explicit = Array.isArray(appGate.effective_controls) ? appGate.effective_controls : null;
            const source = explicit || [
              ...(Array.isArray(appGate.effective_allows) ? appGate.effective_allows : []),
              ...(Array.isArray(appGate.effective_locks) ? appGate.effective_locks : [])
            ];
            const byPackage = new Map();
            for (const item of source) {
              const control = sanitizeControl(item);
              if (!control) continue;
              const previous = byPackage.get(control.package);
              if (!previous || (control.decision === "ALLOW" && previous.decision !== "ALLOW")) {
                byPackage.set(control.package, control);
              }
            }
            return Array.from(byPackage.values());
          }

          function compactTodo(raw) {
            if (!isObject(raw)) return null;
            const id = String(raw.id || "").trim();
            const title = String(raw.title || "").trim();
            if (!id || !title) return null;
            const out = copyKnown(raw, [
              "id", "title", "status", "category", "priority", "deadline_at_ms", "deadline_at_local",
              "updated_at_ms", "overdue", "due_today"
            ]);
            out.id = id;
            out.title = title;
            out.status = String(raw.status || "open") === "completed" ? "completed" : "open";
            return out;
          }

          function todoDueToday(todo, localDate) {
            if (!todo) return false;
            const deadlineMs = positiveNumberOrNull(todo.deadline_at_ms);
            if (deadlineMs === null) return false;
            if (typeof todo.due_today === "boolean") return todo.due_today;
            const local = String(todo.deadline_at_local || todo.deadline || "");
            return Boolean(localDate && local.startsWith(localDate));
          }

          function todoOverdue(todo, nowMs) {
            if (!todo || String(todo.status || "open") !== "open") return false;
            if (typeof todo.overdue === "boolean") return todo.overdue;
            const deadlineMs = positiveNumberOrNull(todo.deadline_at_ms);
            return deadlineMs !== null && nowMs > deadlineMs;
          }

          function sortRelevantTodos(a, b) {
            const ao = a.overdue ? 1 : 0;
            const bo = b.overdue ? 1 : 0;
            if (ao !== bo) return bo - ao;
            const ad = a.due_today ? 1 : 0;
            const bd = b.due_today ? 1 : 0;
            if (ad !== bd) return bd - ad;
            const adeadline = positiveNumberOrNull(a.deadline_at_ms);
            const bdeadline = positiveNumberOrNull(b.deadline_at_ms);
            if (adeadline !== null || bdeadline !== null) {
              if (adeadline === null) return 1;
              if (bdeadline === null) return -1;
              if (adeadline !== bdeadline) return adeadline - bdeadline;
            }
            const au = numberOrNull(a.updated_at_ms) || 0;
            const bu = numberOrNull(b.updated_at_ms) || 0;
            return bu - au || String(a.id).localeCompare(String(b.id));
          }

          function composeTodo(todoState, localDate, nowMs) {
            const rawTodos = isObject(todoState) && Array.isArray(todoState.todos) ? todoState.todos : [];
            const all = rawTodos.map(compactTodo).filter(Boolean).map((todo) => {
              todo.due_today = todoDueToday(todo, localDate);
              todo.overdue = todoOverdue(todo, nowMs);
              return todo;
            });
            const open = all.filter((todo) => todo.status === "open");
            const overdue = open.filter((todo) => todo.overdue).sort(sortRelevantTodos);
            const dueToday = all.filter((todo) => todo.due_today);
            const openDueToday = open.filter((todo) => todo.due_today).sort(sortRelevantTodos);
            const relevant = [...open].sort(sortRelevantTodos);
            const out = {
              open_count: open.length,
              overdue_count: overdue.length,
              due_today_count: dueToday.length,
              open_due_today_count: openDueToday.length,
              overdue_todos: overdue.slice(0, CURRENT_CONTEXT_TODO_LIST_LIMIT),
              open_due_today: openDueToday.slice(0, CURRENT_CONTEXT_TODO_LIST_LIMIT),
              relevant_open_todos: relevant.slice(0, CURRENT_CONTEXT_TODO_LIST_LIMIT)
            };
            const updated = positiveNumberOrNull(todoState?.updated_at_ms);
            if (updated !== null) out.state_updated_at_ms = updated;
            return out;
          }

          function composeDevice(state) {
            const out = {};
            put(out, "local_time", state.local_time);
            put(out, "local_date", state.local_date);
            put(out, "timezone", state.timezone);
            put(out, "device_id", state.device_id);
            put(out, "foreground_app", state.current_app);
            put(out, "foreground_package", state.current_package);
            const battery = numberOrNull(state.battery_percent);
            if (battery !== null && battery >= 0) out.battery_percent = battery;
            if (typeof state.charging === "boolean") out.charging = state.charging;
            put(out, "charging_type", state.charging_type);
            put(out, "network", state.network_type);
            if (typeof state.screen_on === "boolean") out.screen_on = state.screen_on;
            return out;
          }

          function composeAppGate(appGate) {
            const controls = authoritativeControls(appGate);
            const allows = controls.filter((control) => control.decision === "ALLOW");
            const locks = controls.filter((control) => control.decision === "LOCK");
            const out = {
              effective_controls: controls,
              effective_locks: locks,
              effective_allows: allows,
              effective_lock_count: locks.length,
              effective_allow_count: allows.length
            };
            if (typeof appGate?.enabled === "boolean") out.enabled = appGate.enabled;
            return out;
          }

          function composeFocus(raw) {
            const focus = isObject(raw) ? raw : {};
            const out = { active: Boolean(focus.active) };
            if (typeof focus.enabled === "boolean") out.enabled = focus.enabled;
            for (const key of [
              "goal", "reason", "scope", "managed_by_ai", "started_at_ms", "started_at_local",
              "until_ms", "until_local", "remaining_ms", "temporary_active", "temporary_until_ms",
              "temporary_remaining_ms", "emergency_remaining"
            ]) {
              if (Object.prototype.hasOwnProperty.call(focus, key)) put(out, key, focus[key]);
            }
            return out;
          }

          function composeUsage(state) {
            const ready = Boolean(state.usage_permission_ready);
            const out = { available: ready, permission_ready: ready };
            if (!ready) return out;
            const screenMinutes = numberOrNull(state.screen_time_today_minutes);
            if (screenMinutes !== null && screenMinutes >= 0) out.today_screen_time_minutes = screenMinutes;
            const unlocks = numberOrNull(state.unlock_count_today);
            if (unlocks !== null && unlocks >= 0) out.unlock_count_today = unlocks;
            put(out, "last_unlock_at", state.last_unlock_at);
            const top = Array.isArray(state.top_apps_today) ? state.top_apps_today : [];
            out.top_apps = top.slice(0, 5).map((item) => copyKnown(item, ["app", "package", "minutes"]));
            return out;
          }

          function composeAttention({ appGate, todo, focus, freshness }) {
            const items = [];
            if (todo.overdue_count > 0) items.push({ type: "todo_overdue", count: todo.overdue_count });
            for (const allow of appGate.effective_allows) {
              const remaining = numberOrNull(allow.remaining_ms);
              const expiresAt = positiveNumberOrNull(allow.expires_at_ms);
              const item = { type: "temporary_allow_active", package: allow.package };
              if (remaining !== null) item.expires_in_ms = Math.max(0, remaining);
              else if (expiresAt !== null) item.expires_at_ms = expiresAt;
              items.push(item);
            }
            if (focus.active) {
              const item = { type: "focus_active" };
              if (typeof focus.temporary_active === "boolean") item.temporary_release_active = focus.temporary_active;
              items.push(item);
            }
            if (freshness.stale) items.push({ type: "state_stale", age_ms: freshness.age_ms, stale_after_ms: freshness.stale_after_ms });
            return items;
          }

          export function composeCurrentContext(lifeState, options = {}) {
            const state = isObject(lifeState) ? lifeState : {};
            const nowMs = numberOrNull(options.nowMs) ?? Date.now();
            const source = String(options.source || "android_state_upload");
            const transport = String(options.transport || "server_cache");
            const staleAfterMs = positiveNumberOrNull(options.staleAfterMs) ?? CURRENT_CONTEXT_STALE_AFTER_MS;
            const stateUpdatedAt = positiveNumberOrNull(state.updated_at_ms);
            const freshness = freshnessEntry(stateUpdatedAt, nowMs, source, transport, staleAfterMs);

            const device = composeDevice(state);
            const appGate = composeAppGate(state.app_gate);
            const todo = composeTodo(state.todo_state, String(state.local_date || ""), nowMs);
            const focus = composeFocus(state.focus_mode);
            const usage = composeUsage(state);
            const attentionItems = composeAttention({ appGate, todo, focus, freshness });

            return {
              schema_version: CURRENT_CONTEXT_SCHEMA_VERSION,
              generated_at_ms: nowMs,
              device,
              app_gate: appGate,
              todo,
              focus,
              usage,
              attention_items: attentionItems,
              freshness: {
                snapshot: freshness,
                device: { ...freshness },
                app_gate: { ...freshness },
                todo: { ...freshness, ...(todo.state_updated_at_ms ? { data_updated_at_ms: todo.state_updated_at_ms } : {}) },
                focus: { ...freshness },
                usage: { ...freshness }
              }
            };
          }
          '''

          TEST = r'''import assert from "node:assert/strict";
          import { composeCurrentContext, CURRENT_CONTEXT_SCHEMA_VERSION, CURRENT_CONTEXT_STALE_AFTER_MS, CURRENT_CONTEXT_TODO_LIST_LIMIT } from "./current_context.mjs";

          const NOW = 1_800_000_000_000;
          const TODAY = "2027-01-15";
          const TODAY_DEADLINE = NOW + 60_000;

          function baseState() {
            return {
              updated_at_ms: NOW, local_date: TODAY, local_time: "12:00", timezone: "Asia/Tokyo",
              device_id: "android-phone", current_app: "Test App", current_package: "com.test.app",
              battery_percent: 80, charging: false, network_type: "wifi", usage_permission_ready: true,
              screen_time_today_minutes: 120, top_apps_today: [],
              app_gate: { enabled: true, effective_controls: [], effective_locks: [], effective_allows: [] },
              focus_mode: { active: false }, todo_state: { updated_at_ms: NOW, todos: [] }
            };
          }

          function todo(id, status = "open", { deadline = 0, dueToday = false, overdue = false } = {}) {
            return { id, title: `Todo ${id}`, status, priority: "normal", deadline_at_ms: deadline,
              deadline_at_local: deadline ? `${TODAY} 13:00:00` : "", due_today: dueToday, overdue };
          }

          function test(name, fn) {
            try { fn(); console.log(`PASS ${name}`); }
            catch (error) { console.error(`FAIL ${name}`); throw error; }
          }

          test("authoritative ALLOW suppresses conflicting LOCK", () => {
            const s = baseState();
            s.app_gate = { enabled: true,
              effective_controls: [{ decision: "ALLOW", package: "com.x", app_name: "X", reason: "explicit", source: "mcp", approved_by: "ai", type: "real_time", purpose: "break", expires_at_ms: NOW + 60000, remaining_ms: 60000 }],
              effective_locks: [{ decision: "LOCK", package: "com.x", app_name: "X" }],
              effective_allows: [{ decision: "ALLOW", package: "com.x", app_name: "X" }] };
            const c = composeCurrentContext(s, { nowMs: NOW, source: "android_fresh_command", transport: "direct_command" });
            assert.equal(c.app_gate.effective_controls.length, 1);
            assert.equal(c.app_gate.effective_controls[0].decision, "ALLOW");
            assert.equal(c.app_gate.effective_locks.length, 0);
            assert.equal(c.app_gate.effective_allows.length, 1);
            assert.equal(c.app_gate.effective_allows[0].approved_by, "ai");
          });

          test("expired ALLOW state restores LOCK", () => {
            const s = baseState();
            s.app_gate.effective_controls = [{ decision: "LOCK", package: "com.x", app_name: "X", expires_at_ms: NOW + 60000 }];
            const c = composeCurrentContext(s, { nowMs: NOW });
            assert.equal(c.app_gate.effective_allow_count, 0); assert.equal(c.app_gate.effective_lock_count, 1);
            assert.equal(c.app_gate.effective_controls[0].decision, "LOCK");
          });

          test("open Todo count", () => {
            const s = baseState(); s.todo_state.todos = [todo("a"), todo("b"), todo("c", "completed")];
            assert.equal(composeCurrentContext(s, { nowMs: NOW }).todo.open_count, 2);
          });

          test("overdue Todo count", () => {
            const s = baseState();
            s.todo_state.todos = [todo("a", "open", { deadline: NOW - 1000, overdue: true }), todo("b"), todo("c", "completed", { deadline: NOW - 1000, overdue: false })];
            const t = composeCurrentContext(s, { nowMs: NOW }).todo;
            assert.equal(t.overdue_count, 1); assert.deepEqual(t.overdue_todos.map(x => x.id), ["a"]);
          });

          test("completed Todo excluded from open and overdue", () => {
            const s = baseState(); s.todo_state.todos = [todo("done", "completed", { deadline: NOW - 1000, overdue: true })];
            const t = composeCurrentContext(s, { nowMs: NOW }).todo;
            assert.equal(t.open_count, 0); assert.equal(t.overdue_count, 0); assert.equal(t.relevant_open_todos.length, 0);
          });

          test("due_today differs from open_due_today", () => {
            const s = baseState();
            s.todo_state.todos = [todo("open", "open", { deadline: TODAY_DEADLINE, dueToday: true }), todo("done", "completed", { deadline: TODAY_DEADLINE, dueToday: true })];
            const t = composeCurrentContext(s, { nowMs: NOW }).todo;
            assert.equal(t.due_today_count, 2); assert.equal(t.open_due_today_count, 1); assert.deepEqual(t.open_due_today.map(x => x.id), ["open"]);
          });

          test("completed deadline today counts due_today only", () => {
            const s = baseState(); s.todo_state.todos = [todo("done", "completed", { deadline: TODAY_DEADLINE, dueToday: true })];
            const t = composeCurrentContext(s, { nowMs: NOW }).todo;
            assert.equal(t.due_today_count, 1); assert.equal(t.open_due_today_count, 0);
          });

          test("no deadline Todo never due_today", () => {
            const s = baseState(); s.todo_state.todos = [{ ...todo("no-deadline"), due_today: true, deadline_at_ms: 0, deadline_at_local: "" }];
            const t = composeCurrentContext(s, { nowMs: NOW }).todo;
            assert.equal(t.due_today_count, 0); assert.equal(t.open_due_today_count, 0);
          });

          test("Todo history is bounded and not dumped", () => {
            const s = baseState();
            s.todo_state.todos = [...Array.from({ length: 40 }, (_, i) => todo(`done-${i}`, "completed")), ...Array.from({ length: 20 }, (_, i) => todo(`open-${i}`, "open"))];
            const c = composeCurrentContext(s, { nowMs: NOW });
            assert.equal(Object.prototype.hasOwnProperty.call(c.todo, "todos"), false);
            assert.equal(c.todo.relevant_open_todos.length, CURRENT_CONTEXT_TODO_LIST_LIMIT);
            assert.equal(c.todo.relevant_open_todos.some(x => x.status === "completed"), false);
            assert.equal(JSON.stringify(c.todo).includes("done-39"), false);
          });

          test("freshness stale boundary", () => {
            const fresh = baseState(); fresh.updated_at_ms = NOW - CURRENT_CONTEXT_STALE_AFTER_MS + 1;
            assert.equal(composeCurrentContext(fresh, { nowMs: NOW }).freshness.snapshot.stale, false);
            const stale = baseState(); stale.updated_at_ms = NOW - CURRENT_CONTEXT_STALE_AFTER_MS;
            const c = composeCurrentContext(stale, { nowMs: NOW });
            assert.equal(c.freshness.snapshot.stale, true); assert.equal(c.freshness.snapshot.age_ms, CURRENT_CONTEXT_STALE_AFTER_MS);
          });

          test("attention_items are objective structured facts", () => {
            const s = baseState(); s.updated_at_ms = NOW - CURRENT_CONTEXT_STALE_AFTER_MS;
            s.todo_state.todos = [todo("late", "open", { deadline: NOW - 1000, overdue: true })];
            s.focus_mode = { active: true, temporary_active: false };
            s.app_gate.effective_controls = [{ decision: "ALLOW", package: "com.x", remaining_ms: 5000, expires_at_ms: NOW + 5000 }];
            const items = composeCurrentContext(s, { nowMs: NOW }).attention_items;
            assert.deepEqual(items.map(x => x.type), ["todo_overdue", "temporary_allow_active", "focus_active", "state_stale"]);
            const text = JSON.stringify(items);
            for (const banned of ["懒", "批评", "应该", "必须学习", "娱乐", "偷懒"]) assert.equal(text.includes(banned), false);
          });

          test("schema_version stable and parseable", () => {
            const c = composeCurrentContext(baseState(), { nowMs: NOW });
            assert.equal(c.schema_version, CURRENT_CONTEXT_SCHEMA_VERSION); assert.equal(JSON.parse(JSON.stringify(c)).schema_version, 1);
          });

          console.log("CurrentContextBehaviorTest: ALL PASS");
          '''

          def dedent_js(s: str) -> str:
              lines = s.splitlines()
              out = []
              for line in lines:
                  out.append(line[10:] if line.startswith('          ') else line)
              return '\n'.join(out).rstrip() + '\n'

          Path('server/current_context.mjs').write_text(dedent_js(COMPOSER), encoding='utf-8')
          Path('server/current_context.test.mjs').write_text(dedent_js(TEST), encoding='utf-8')

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('mcp/server.js',
              'import path from "path";\n',
              'import path from "path";\nimport { composeCurrentContext } from "../server/current_context.mjs";\n')

          node_anchor = '''function parsePhoneResult(command) {
            if (!command || !command.result) return null;
            try { return JSON.parse(command.result); } catch { return command.result; }
          }
          '''
          node_helper = node_anchor + '''
          async function getCurrentContextSnapshot(device_id = DEFAULT_DEVICE, wait_seconds = 5) {
            let fresh_error = "";
            let fresh_command_status = "not_started";
            try {
              const queued = await postCommand({ action: "get_life_state", device_id, payload: { action: "get_life_state" } });
              const id = queued?.command?.id;
              const observed = id ? await waitCommand(id, Math.max(3, Math.min(10, Number(wait_seconds || 5)))) : null;
              const command = observed?.command || queued?.command || null;
              fresh_command_status = String(command?.status || (id ? "pending" : "queue_failed"));
              if (command?.status === "completed") {
                const phoneState = parsePhoneResult(command);
                if (phoneState && typeof phoneState === "object" && !Array.isArray(phoneState)) {
                  return {
                    ok: true,
                    ...composeCurrentContext(phoneState, { source: "android_fresh_command", transport: "direct_command" }),
                    retrieval: { fresh_command_status: "completed", fallback_used: false }
                  };
                }
                fresh_error = "fresh_life_state_invalid";
              }
            } catch (error) {
              fresh_error = String(error?.message || error);
            }

            try {
              const res = await linjianFetch(`/api/device/state?device_id=${encodeURIComponent(device_id)}`, { timeout_ms: QUICK_FETCH_TIMEOUT_MS });
              const data = await res.json();
              const cachedState = data?.state || data?.life_state || null;
              if (!cachedState || typeof cachedState !== "object") {
                return { ok: false, error: "current_context_unavailable", fresh_command_status, fresh_error: fresh_error || undefined };
              }
              return {
                ok: true,
                ...composeCurrentContext(cachedState, { source: "android_state_upload", transport: "server_cache" }),
                retrieval: { fresh_command_status, fallback_used: true, fresh_error: fresh_error || undefined }
              };
            } catch (error) {
              return { ok: false, error: "current_context_unavailable", fresh_command_status, fresh_error: fresh_error || undefined, cache_error: String(error?.message || error) };
            }
          }
          '''
          replace_once('mcp/server.js', node_anchor, node_helper)

          tool_anchor = '  async function runTodoCommand(action, args = {}, waitSeconds = DEFAULT_COMMAND_WAIT_SECONDS) {\n'
          tool_code = '''  server.tool("get_current_context", "调用本工具获取苹果乐园当前共享事实，再据此由 AI 做判断。返回的是事实快照，不代表苹果乐园已经替 AI 做出‘该提醒、允许、拒绝或批评’的主观决定。只读工具；不会修改 Todo、AppGate、Focus，也不会自动放行。", { device_id: z.string().default(DEFAULT_DEVICE), wait_seconds: z.number().int().min(3).max(10).default(5) }, async ({ device_id = DEFAULT_DEVICE, wait_seconds = 5 }) => {
            return textResult(await getCurrentContextSnapshot(device_id, wait_seconds));
          });

          ''' + tool_anchor
          replace_once('mcp/server.js', tool_anchor, tool_code)

          replace_once('mcp/server.js',
              '    "todo_action", "get_todos",\n',
              '    "get_current_context", "todo_action", "get_todos",\n')

          replace_once('server/linjian_server.py',
              '"todo_action", "get_todos", ',
              '"todo_action", "get_todos", "get_life_state", ')

          replace_once('server/cloudflare-worker/worker.js',
              'const VERSION = "0.3.8.4-public-focus";\n',
              'import { composeCurrentContext } from "../current_context.mjs";\n\nconst VERSION = "0.3.8.4-public-focus";\n')

          replace_once('server/cloudflare-worker/worker.js',
              '"run_sequence", "save_known_app", "get_screen_nodes",',
              '"run_sequence", "save_known_app", "get_life_state", "get_screen_nodes",')

          worker_tool_anchor = '  { name: "get_life_state", description: "读取掌心窗生活状态层：电量、当前 App、屏幕时间、网络、天气等最近状态。", inputSchema: obj({ device_id: str(DEFAULT_DEVICE) }) },\n'
          worker_tool = worker_tool_anchor + '  { name: "get_current_context", description: "调用本工具获取苹果乐园当前共享事实，再据此由 AI 做判断。返回的是事实快照，不代表苹果乐园已经替 AI 做出‘该提醒、允许、拒绝或批评’的主观决定。只读工具；不会修改 Todo、AppGate、Focus，也不会自动放行。", inputSchema: obj({ device_id: str(DEFAULT_DEVICE), wait_seconds: int(5) }) },\n'
          replace_once('server/cloudflare-worker/worker.js', worker_tool_anchor, worker_tool)

          worker_case_anchor = '''    case "get_phone_state":
              case "get_life_state": return mcpText(await state());
          '''
          worker_case = '''    case "get_phone_state":
              case "get_life_state": return mcpText(await state());
              case "get_current_context": {
                let freshError = "";
                let freshStatus = "not_started";
                try {
                  const queued = await enqueue({ action: "get_life_state", payload: { action: "get_life_state" } });
                  const id = queued?.command?.id;
                  const obs = id ? await waitCommand(env, id, Math.max(3, Math.min(10, Number(args.wait_seconds ?? 5)))) : null;
                  const command = obs?.command || queued?.command || null;
                  freshStatus = String(command?.status || (id ? "pending" : "queue_failed"));
                  if (command?.status === "completed" && command.result) {
                    let phoneState = null;
                    try { phoneState = JSON.parse(command.result); } catch (_) { }
                    if (phoneState && typeof phoneState === "object" && !Array.isArray(phoneState)) {
                      return mcpText({ ok: true, ...composeCurrentContext(phoneState, { source: "android_fresh_command", transport: "direct_command" }), retrieval: { fresh_command_status: "completed", fallback_used: false } });
                    }
                    freshError = "fresh_life_state_invalid";
                  }
                } catch (error) {
                  freshError = String(error?.message || error);
                }
                const cached = await state().catch((error) => ({ ok: false, error: String(error?.message || error) }));
                const cachedState = cached?.state || cached?.life_state || null;
                if (!cachedState || typeof cachedState !== "object") return mcpText({ ok: false, error: "current_context_unavailable", fresh_command_status: freshStatus, fresh_error: freshError || undefined, cache_error: cached?.error || undefined }, true);
                return mcpText({ ok: true, ...composeCurrentContext(cachedState, { source: "android_state_upload", transport: "server_cache" }), retrieval: { fresh_command_status: freshStatus, fallback_used: true, fresh_error: freshError || undefined } });
              }
          '''
          replace_once('server/cloudflare-worker/worker.js', worker_case_anchor, worker_case)
          PY

      - name: Current-context behavior tests
        run: node server/current_context.test.mjs

      - name: Syntax checks
        run: |
          node --check server/current_context.mjs
          node --check mcp/server.js
          node --check server/cloudflare-worker/worker.js
          python3 -m py_compile server/linjian_server.py

      - name: Java AppGate and Todo regressions
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/json.jar
          rm -rf /tmp/apple-park-tests && mkdir -p /tmp/apple-park-tests
          javac -cp /tmp/json.jar -d /tmp/apple-park-tests \
            android/app/src/main/java/dev/linjian/peek/AppGateDecisionRules.java \
            android/app/src/main/java/dev/linjian/peek/TodoStateCore.java \
            android/tests/AppGateDecisionRulesTest.java \
            android/tests/AppGateStateTransitionTest.java \
            android/tests/TodoStateBehaviorTest.java
          java -cp /tmp/apple-park-tests:/tmp/json.jar dev.linjian.peek.AppGateDecisionRulesTest
          java -cp /tmp/apple-park-tests:/tmp/json.jar dev.linjian.peek.AppGateStateTransitionTest
          java -cp /tmp/apple-park-tests:/tmp/json.jar dev.linjian.peek.TodoStateBehaviorTest

      - name: Android build and APK existence
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/build.sh
          bash android/build.sh
          test -f android/Zhangxinchuang-public-v0.3.8.4.apk
          ls -lh android/Zhangxinchuang-public-v0.3.8.4.apk

      - name: Diff hygiene
        run: git diff --check

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: apple-paradise-phase3-debug-apk
          path: android/Zhangxinchuang-public-v0.3.8.4.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified production changes to v1-dev
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase3-current-context-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(v1): add current context snapshot"
          git pull --rebase origin v1-dev
          git push origin HEAD:v1-dev
